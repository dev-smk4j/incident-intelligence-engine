# Local profile for running without Docker/PostgreSQL. The schema is created by
# the same Flyway migration used against PostgreSQL, so the SQL stays honest.
spring:
  datasource:
    url: jdbc:h2:mem:simulator;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

spring:
  datasource:
    url: jdbc:h2:mem:simulator-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

# Schedulers are disabled in tests. Tests call traffic generation and detection
# explicitly so assertions do not race with a background thread.
simulator:
  traffic:
    enabled: false
  detection:
    enabled: false

logging:
  level:
    root: WARN
    telemetry: OFF
